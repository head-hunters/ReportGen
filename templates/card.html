<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project Card</title>

    <style>

        /* Entire page */

        body {
            margin: 0;
            background-color: #ffffff;
            color: #000000;

            min-height: 100vh;

            font-family: Arial, sans-serif;
        }


        /* Card container */

        .project-card-container {
            width: 100%;
            min-height: 100vh;

            display: flex;

            justify-content: center;
            align-items: flex-end;

            padding-bottom: 40px;

            box-sizing: border-box;
        }


        .project-card {
             width: 210px;
             
             background-color: #ffffff;
             color: #000000;
             
             border: 1px solid #555555;
             border-radius: 8px;
             
             padding: 12px;
             
             box-sizing: border-box;
             
             box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
             
        }
        
        .project-card:hover {
            border: 1.5px solid #000000;
        }


        /* Project title */

        .project-title {
            color: #000000;

            font-size: 15px;
            font-weight: 600;

            margin: 0;

            line-height: 1.3;
        }


        /* Project date */

        .project-date {
            color: #666666;

            font-size: 11px;

            margin: 2px 0 10px 0;
        }


        /* Buttons container */

        .project-buttons {
            display: flex;

            gap: 4px;
        }


        /* Buttons */

        .project-btn {
            flex: 1;

            background-color: #000000;
            color: #ffffff;

            border: 1px solid #000000;
            border-radius: 4px;

            padding: 5px 3px;

            font-size: 10px;

            cursor: pointer;
        }


        /* Button hover */

        .project-btn:hover {
            background-color: #333333;
        }


        /* Delete button */

        .delete-btn {
            background-color: #ffffff;
            color: #000000;

            border: 1px solid #555555;
        }


        /* Delete hover */

        .delete-btn:hover {
            background-color: #000000;
            color: #ffffff;
        }

    </style>

</head>


<body>


    <!-- PROJECT CARD -->

    <div class="project-card-container">

        <div class="project-card">

            <h5 class="project-title">
                Smart Campus Management
            </h5>

            <p class="project-date">
                19 September 2026
            </p>

            <div class="project-buttons">

                <button type="button" class="project-btn">
                    View
                </button>

                <button type="button" class="project-btn">
                    Edit
                </button>

                <button type="button" class="project-btn delete-btn">
                    Delete
                </button>

            </div>

        </div>

    </div>


</body>

</html>
