<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Project Report Builder{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>



    <main class="container py-5 d-flex flex-column align-items-center justify-content-center min-vh-100 text-center">
        {% block content %}
        {% endblock %}
    </main>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>


    <!-- For flashing errors -->

    {% with messages=get_flashed_messages()%}
    {% if messages%}

    <div class="modal fade" id="flashModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Error</h5>
                </div>

                <div class="modal-body">
                    {{messages[0]}}
                </div>

            </div>
        </div>
    </div>




    {%endif%}
    {%endwith%}



    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
